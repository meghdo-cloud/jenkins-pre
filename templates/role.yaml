apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins
  namespace: jenkins
rules:
  - apiGroups:
      - '*'
    resources:
      - replicationcontrollers
      - events
      - daemonsets
      - services
      - replicasets
      - poddisruptionbudget
      - namespaces
      - podsecuritypolicies
      - jobs
      - deployments/scale
      - pods/log
      - pods
      - secrets
      - podtemplates
      - configmaps
      - endpoints
      - cronjobs
      - persistentvolumeclaims
      - podpreset
      - persistentvolumes
      - pods/exec
      - statefulsets
      - serviceaccounts
      - deployments
      - ingress
      - gateways
      - virtualservices
      - destinationrules
      - envoyfilters
      - certificates
      - requestauthentications
      - authorizationpolicies
      - peerauthentications
      - sidecars
    verbs:
      - list
      - watch
      - create
      - update
      - patch
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
      - watch
      - update
      - get
